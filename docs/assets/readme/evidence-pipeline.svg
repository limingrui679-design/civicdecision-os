<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">CivicDecision OS evidence-to-release pipeline</title>
  <desc id="desc">Public evidence is typed, analyzed with bounded methods, tested for reversals, and released as either a completed DecisionPack or an auditable withheld result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b31"/>
      <stop offset="1" stop-color="#123940"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04171b" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f2d5a2"/>
    </marker>
    <style>
      .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 600; letter-spacing: 2px; fill: #f07b67; }
      .heading { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #fff8e8; }
      .step { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #fff8e8; }
      .copy { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #c7d6d5; }
      .number { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #0b2b31; }
      .pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #f2d5a2; }
      .result { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0b2b31; }
      .resultcopy { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #27464a; }
    </style>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1290" cy="76" r="112" fill="none" stroke="#f2d5a2" stroke-opacity="0.12"/>
  <circle cx="1290" cy="76" r="74" fill="none" stroke="#f07b67" stroke-opacity="0.18"/>
  <text x="64" y="60" class="eyebrow">ONE TRACEABLE PATH</text>
  <text x="64" y="102" class="heading">Evidence in. Bounded decision—or an explicit no.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="152" width="230" height="208" rx="20" fill="#173f45" stroke="#356269"/>
    <circle cx="98" cy="188" r="17" fill="#f2d5a2"/><text x="94" y="193" class="number">1</text>
    <text x="84" y="238" class="step">Version sources</text>
    <text x="84" y="269" class="copy">Public-data fixture</text>
    <text x="84" y="292" class="copy">manifest · hash · license</text>
    <text x="84" y="315" class="copy">coverage · limitations</text>

    <rect x="326" y="152" width="230" height="208" rx="20" fill="#173f45" stroke="#356269"/>
    <circle cx="360" cy="188" r="17" fill="#f2d5a2"/><text x="356" y="193" class="number">2</text>
    <text x="346" y="238" class="step">Type evidence</text>
    <text x="346" y="269" class="copy">Observed stays observed.</text>
    <text x="346" y="292" class="copy">Models never become impact.</text>
    <text x="346" y="315" class="copy">Unsupported upgrades fail.</text>

    <rect x="588" y="152" width="230" height="208" rx="20" fill="#173f45" stroke="#356269"/>
    <circle cx="622" cy="188" r="17" fill="#f2d5a2"/><text x="618" y="193" class="number">3</text>
    <text x="608" y="238" class="step">Run methods</text>
    <text x="608" y="269" class="copy">Replay · forecast</text>
    <text x="608" y="292" class="copy">simulate · optimize</text>
    <text x="608" y="315" class="copy">with declared constraints</text>

    <rect x="850" y="152" width="230" height="208" rx="20" fill="#173f45" stroke="#356269"/>
    <circle cx="884" cy="188" r="17" fill="#f2d5a2"/><text x="880" y="193" class="number">4</text>
    <text x="870" y="238" class="step">Stress the result</text>
    <text x="870" y="269" class="copy">Reversal conditions</text>
    <text x="870" y="292" class="copy">value of information</text>
    <text x="870" y="315" class="copy">evidence and release gates</text>
  </g>

  <path d="M294 256 H316" stroke="#f2d5a2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M556 256 H578" stroke="#f2d5a2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M818 256 H840" stroke="#f2d5a2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1080 256 H1110 V205 H1130" stroke="#f2d5a2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1110 256 V313 H1130" stroke="#f2d5a2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1140" y="152" width="196" height="104" rx="18" fill="#f2d5a2"/>
    <circle cx="1173" cy="184" r="13" fill="#2e8b72"/>
    <path d="M1167 184 l4 4 8-10" fill="none" stroke="#fff8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1196" y="190" class="result">DecisionPack</text>
    <text x="1164" y="221" class="resultcopy">completed · checksummed</text>

    <rect x="1140" y="276" width="196" height="104" rx="18" fill="#fff8e8"/>
    <circle cx="1173" cy="308" r="13" fill="#f07b67"/>
    <path d="M1167 308 h12" stroke="#fff8e8" stroke-width="3" stroke-linecap="round"/>
    <text x="1196" y="314" class="result">Withheld</text>
    <text x="1164" y="340" class="resultcopy">reason · gaps</text>
    <text x="1164" y="358" class="resultcopy">next evidence</text>
  </g>

  <g>
    <rect x="64" y="406" width="120" height="34" rx="17" fill="#173f45" stroke="#5d7c80"/><text x="82" y="428" class="pill">OBSERVED</text>
    <rect x="196" y="406" width="122" height="34" rx="17" fill="#173f45" stroke="#5d7c80"/><text x="216" y="428" class="pill">ESTIMATED</text>
    <rect x="330" y="406" width="108" height="34" rx="17" fill="#173f45" stroke="#5d7c80"/><text x="350" y="428" class="pill">CAUSAL</text>
    <rect x="450" y="406" width="120" height="34" rx="17" fill="#173f45" stroke="#5d7c80"/><text x="470" y="428" class="pill">SIMULATED</text>
    <rect x="582" y="406" width="120" height="34" rx="17" fill="#173f45" stroke="#5d7c80"/><text x="600" y="428" class="pill">OPTIMIZED</text>
    <rect x="714" y="406" width="116" height="34" rx="17" fill="#173f45" stroke="#5d7c80"/><text x="733" y="428" class="pill">PROPOSED</text>
    <text x="870" y="428" class="copy">Types constrain claims; they do not certify policy validity.</text>
  </g>
</svg>
