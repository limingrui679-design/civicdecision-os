<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">CivicDecision OS catalog layers and product surfaces</title>
  <desc id="desc">Tier G, Tier S, and Tier D evidence layers feed one validated artifact store exposed through an explorer, API, SDK, CLI, and data-only plugin interface.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1e3"/>
      <stop offset="1" stop-color="#efe3cf"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15343a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#315a61"/>
    </marker>
    <style>
      .eyebrow2 { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #d65f50; }
      .heading2 { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #14343a; }
      .tier { font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #fff8e8; }
      .big { font-family: Inter, Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #f2d5a2; }
      .copy2 { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #c9d9d8; }
      .core { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #14343a; }
      .corecopy { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #34565b; }
      .surface { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #fff8e8; }
      .metric { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #14343a; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #5b6e70; }
      .note { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #7a4b43; }
    </style>
  </defs>
  <rect width="1400" height="600" rx="28" fill="url(#bg2)"/>
  <text x="64" y="58" class="eyebrow2">ONE VALIDATED CORE · FIVE SURFACES</text>
  <text x="64" y="101" class="heading2">Different evidence depth, one claim boundary.</text>

  <g filter="url(#shadow2)">
    <rect x="64" y="144" width="270" height="112" rx="20" fill="#123940"/>
    <text x="88" y="180" class="tier">Tier G · geographic index</text>
    <text x="88" y="229" class="big">250</text>
    <text x="167" y="210" class="copy2">deterministic city points</text>
    <text x="167" y="231" class="copy2">identity · coordinates</text>
    <text x="167" y="248" class="copy2">limitations retained</text>

    <rect x="64" y="274" width="270" height="112" rx="20" fill="#17484f"/>
    <text x="88" y="310" class="tier">Tier S · standard screen</text>
    <text x="88" y="359" class="big">30</text>
    <text x="157" y="338" class="copy2">selected bundles</text>
    <text x="157" y="358" class="copy2">descriptive screen</text>
    <text x="157" y="376" class="copy2">no recommendation</text>

    <rect x="64" y="404" width="270" height="112" rx="20" fill="#1c5860"/>
    <text x="88" y="440" class="tier">Tier D · deep evidence</text>
    <text x="88" y="489" class="big">8</text>
    <text x="136" y="470" class="copy2">audited city adapters</text>
    <text x="136" y="492" class="copy2">96 gated scenario packs</text>
  </g>

  <path d="M334 200 H424" stroke="#315a61" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M334 330 H388 Q424 330 424 294" stroke="#315a61" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <path d="M334 460 H388 Q424 460 424 388" stroke="#315a61" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="440" y="178" width="410" height="308" rx="28" fill="#fffaf0" stroke="#d7c6a7" stroke-width="2"/>
    <rect x="472" y="210" width="94" height="30" rx="15" fill="#f07b67"/>
    <text x="491" y="231" class="surface">CORE</text>
    <text x="472" y="282" class="core">Validated artifact store</text>
    <text x="472" y="313" class="corecopy">Reconciles identities, sources, executions, designs,</text>
    <text x="472" y="336" class="corecopy">benchmarks, and positive or negative DecisionPacks.</text>
    <line x1="472" y1="366" x2="818" y2="366" stroke="#decfb5"/>
    <text x="472" y="404" class="metric">258</text><text x="532" y="403" class="label">highest-available city records</text>
    <text x="472" y="440" class="metric">98</text><text x="522" y="439" class="label">DecisionPacks · including negative releases</text>
    <text x="472" y="465" class="note">TIER ASSIGNMENTS OVERLAP</text>
    <text x="472" y="481" class="note">COUNTS ARE NOT ADDITIVE</text>
  </g>

  <path d="M850 332 H930" stroke="#315a61" stroke-width="3" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="952" y="144" width="182" height="64" rx="18" fill="#123940"/><text x="1000" y="184" class="surface">Explorer</text>
    <rect x="1154" y="144" width="182" height="64" rx="18" fill="#123940"/><text x="1219" y="184" class="surface">REST API</text>
    <rect x="952" y="228" width="182" height="64" rx="18" fill="#17484f"/><text x="1017" y="268" class="surface">SDK</text>
    <rect x="1154" y="228" width="182" height="64" rx="18" fill="#17484f"/><text x="1221" y="268" class="surface">CLI</text>
    <rect x="1053" y="312" width="182" height="64" rx="18" fill="#1c5860"/><text x="1090" y="352" class="surface">Data-only plugin</text>
  </g>

  <g>
    <rect x="930" y="416" width="406" height="100" rx="20" fill="#e5d5b9"/>
    <text x="956" y="450" class="metric">90</text><text x="997" y="449" class="label">source artifacts</text>
    <text x="1120" y="450" class="metric">188</text><text x="1173" y="449" class="label">executions</text>
    <text x="956" y="486" class="metric">240</text><text x="1009" y="485" class="label">designs</text>
    <text x="1120" y="486" class="metric">145</text><text x="1173" y="485" class="label">benchmark runs</text>
  </g>

  <text x="64" y="558" class="note">G = DISCOVERY · S = SCREENING · D = DEEP EVIDENCE · DEPTH NEVER UPGRADES A MODELED RESULT INTO OBSERVED IMPACT</text>
</svg>
