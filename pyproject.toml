[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "civicdecision"
dynamic = ["version"]
description = "An evidence-typed compiler for urban interventions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mingrui Li" }]
keywords = [
  "urban analytics",
  "decision intelligence",
  "policy simulation",
  "resilience",
  "optimization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
data = [
  "duckdb>=1.2,<2",
  "polars>=1.20,<2",
  "pyarrow>=18,<22",
]
graph = ["networkx>=3.3,<4"]
optimization = ["scipy>=1.14,<2", "ortools>=9.11,<10"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = [
  "fastapi>=0.115,<1",
  "hatchling>=1.27",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
  "uvicorn>=0.34,<1",
]
release = [
  "bandit[toml]>=1.9,<2",
  "build>=1.5,<2",
  "check-wheel-contents>=0.6,<1",
  "cyclonedx-bom>=7.3,<8",
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.10,<3",
  "pip-licenses>=5.5,<6",
  "pip-tools>=7.6,<8",
  "twine>=6.2,<7",
]
all = [
  "duckdb>=1.2,<2",
  "polars>=1.20,<2",
  "pyarrow>=18,<22",
  "networkx>=3.3,<4",
  "scipy>=1.14,<2",
  "ortools>=9.11,<10",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
civicdecision = "civicdecision.cli:app"

[project.urls]
Documentation = "https://github.com/limingrui679-design/civicdecision-os#readme"
Issues = "https://github.com/limingrui679-design/civicdecision-os/issues"
Repository = "https://github.com/limingrui679-design/civicdecision-os"

[tool.hatch.build.targets.wheel]
packages = ["src/civicdecision"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/.github",
  "/.secrets.baseline",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/SECURITY.md",
  "/benchmarks",
  "/catalog",
  "/docs",
  "/examples",
  "/governance",
  "/pyproject.toml",
  "/requirements",
  "/schemas",
  "/scripts",
  "/src",
  "/tests",
  "/verification",
]
exclude = [
  "/verification/milestone-8-release.json",
]

[tool.hatch.version]
path = "src/civicdecision/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["civicdecision"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["civicdecision"]
