name: Traffic snapshot

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect bounded GitHub signals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect_github_funnel.py --output github-funnel.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-funnel-${{ github.run_id }}
          path: github-funnel.json
          retention-days: 30
          if-no-files-found: error
