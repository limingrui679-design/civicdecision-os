name: Reproducible release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality and release tooling
        run: python -m pip install -e '.[dev,release]'
      - name: Run repository quality gates
        run: make check
      - name: Build and independently verify release candidate
        run: >-
          python scripts/build_release_candidate.py
          --output-dir dist/release-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: civicdecision-release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: dist/release-${{ github.sha }}/
