name: Security evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security tooling
        run: python -m pip install -e '.[release]'
      - name: Scan source for medium-or-higher findings
        run: >-
          bandit -r src/civicdecision --severity-level medium --confidence-level medium
          --format json --output verification/ci-bandit.json
      - name: Verify committed secret baseline remains empty
        run: |
          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          from scripts.build_release_candidate import _scan_candidates

          root = Path.cwd()
          report = root / "verification/ci-detect-secrets.json"
          shutil.copyfile(root / ".secrets.baseline", report)
          subprocess.run(
              [
                  "detect-secrets",
                  "scan",
                  "--baseline",
                  str(report),
                  "--force-use-all-plugins",
                  "--no-verify",
                  *_scan_candidates(root),
              ],
              check=True,
              cwd=root,
          )
          assert json.loads(report.read_text(encoding="utf-8"))["results"] == {}
          PY
      - name: Audit exact hashed runtime lock
        run: >-
          pip-audit -r requirements/runtime-api.lock --require-hashes --no-deps
          --progress-spinner off --format json --output verification/ci-dependency-audit.json
      - name: Validate hashed runtime installation inputs
        run: >-
          python -m pip install --dry-run --ignore-installed --require-hashes
          -r requirements/runtime-api.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            verification/ci-detect-secrets.json
            verification/ci-bandit.json
            verification/ci-dependency-audit.json
