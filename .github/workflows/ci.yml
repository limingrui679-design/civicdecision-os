name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development checks
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy src/civicdecision
      - name: Test with branch coverage
        run: pytest -q --cov=civicdecision --cov-report=term-missing --cov-report=xml
      - name: Verify committed public artifacts and exact rebuilds
        run: python scripts/verify_repository.py --report verification/ci-report.json
      - name: Build wheel smoke test
        run: |
          python -m pip install build twine check-wheel-contents
          python -m build --wheel --sdist --outdir dist
          twine check --strict dist/*
          check-wheel-contents --no-config dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            verification/ci-report.json
            dist/*.whl
