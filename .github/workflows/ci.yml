name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development checks
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy src/civicdecision
      - name: Test with branch coverage
        run: pytest -q --cov=civicdecision --cov-report=term-missing --cov-report=xml
      - name: Verify committed public artifacts and exact rebuilds
        run: python scripts/verify_repository.py --report verification/ci-report.json
      - name: Build wheel smoke test
        run: |
          python -m pip install build twine check-wheel-contents
          python -m build --wheel --sdist --outdir dist
          twine check --strict dist/*
          check-wheel-contents --no-config dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            verification/ci-report.json
            dist/*.whl
